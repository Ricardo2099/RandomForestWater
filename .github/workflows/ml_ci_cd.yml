
name: Modelops deploy

on:
  repository_dispatch:
    types: [ml_ci_cd]

jobs:
  ml_ci_cd:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: list
        run: python --version

      - name: pip install
        run: pip install -r requirements-docker.txt

      - name: download dataset
        env:
          DATASET_URL: ${{ github.event.client_payload.dataseturl }}
        run: wget -O Watera.csv "$DATASET_URL"

      - name: cat dataset
        run: head -n 5 Watera.csv

      - name: train model
        run: python random_forest_agua.py

      - name: docker build
        env:
          IMAGE_TAG: ${{ github.event.client_payload.sha }}
        run: docker build -t ${{ secrets.DOCKER_USER }}/${{ secrets.MODEL_NAME }}:$IMAGE_TAG .

      - name: show images
        run: docker images

      - name: docker login
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin

      - name: docker push
        env:
          IMAGE_TAG: ${{ github.event.client_payload.sha }}
        run: docker push ${{ secrets.DOCKER_USER }}/${{ secrets.MODEL_NAME }}:$IMAGE_TAG
